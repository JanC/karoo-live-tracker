# Deploys to Fly.io on every push to master. Uses the same mise task (and pinned flyctl) as
# a local `mise run deploy`. Needs the FLY_API_TOKEN repository secret (`fly tokens create deploy`).
# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "screens/**"
      - ".env.example"
      - "compose.yaml"
jobs:
  deploy:
    name: Deploy app
    if: github.repository == 'JanC/karoo-live-tracker'  # forks have no token
    runs-on: ubuntu-latest
    concurrency: deploy-group  # one deploy at a time
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
