# fly.toml app configuration file generated for karoo-live on 2026-09-28T14:42:18+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'karoo-live'
primary_region = 'fra'

[build]
[env]
  PORT = '8765'

[[mounts]]
  source = 'cache'
  destination = '/app/cache'

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
